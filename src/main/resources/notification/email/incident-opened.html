<!DOCTYPE html>
<!-- Every value goes through th:text, which escapes it: the monitor name is typed by a user (T-34) -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'DOWN: ' + ${monitorName}">DOWN</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #1f2328; line-height: 1.5;">
<p style="font-size: 18px; margin: 0 0 16px;">
    <strong style="color: #b42318;">DOWN</strong> &middot; <strong th:text="${monitorName}">Payments API</strong>
</p>
<table style="border-collapse: collapse;">
    <tr>
        <td style="padding: 2px 16px 2px 0; color: #59636e;">Since</td>
        <td th:text="${openedAt}">2026-09-28 10:03:00 UTC</td>
    </tr>
    <tr>
        <td style="padding: 2px 16px 2px 0; color: #59636e;">Cause</td>
        <td th:text="${cause}">TIMEOUT</td>
    </tr>
    <tr th:if="${httpStatus != ''}">
        <td style="padding: 2px 16px 2px 0; color: #59636e;">HTTP status</td>
        <td th:text="${httpStatus}">503</td>
    </tr>
    <tr>
        <td style="padding: 2px 16px 2px 0; color: #59636e;">Incident</td>
        <td th:text="${incidentId}">0192…</td>
    </tr>
</table>
<p style="margin-top: 24px; font-size: 12px; color: #59636e;">
    Sent by OpsWatch to the channel <span th:text="${channelName}">On call</span>. You will get another email when
    the incident is resolved.
</p>
</body>
</html>
