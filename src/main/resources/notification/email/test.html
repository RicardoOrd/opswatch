<!DOCTYPE html>
<!-- Every value goes through th:text, which escapes it: the channel name is typed by a user (T-34) -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Test notification</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #1f2328; line-height: 1.5;">
<p style="font-size: 18px; margin: 0 0 16px;"><strong>Test notification</strong></p>
<p style="margin: 0 0 16px;">
    Someone asked OpsWatch to test the channel <strong th:text="${channelName}">On call</strong>. If you are reading
    this, it works: the incidents it covers will be announced here.
</p>
<p style="margin-top: 24px; font-size: 12px; color: #59636e;">Delivery <span th:text="${deliveryId}">0192…</span></p>
</body>
</html>
