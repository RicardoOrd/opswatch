# Valores por defecto seguros para todos los entornos. Sin secretos: llegan por variables de entorno o Docker secrets.
# Catálogo completo de propiedades: docs/devops/environments.md#catálogo-de-propiedades
spring:
  application:
    name: opswatch
  profiles:
    group:
      # staging y production comparten la configuración de application-deployed.yml
      staging: deployed
      production: deployed
  threads:
    virtual:
      # Java 25 no fija virtual threads en synchronized (JEP 491): Tomcat, @Async y @Scheduled sin pools que dimensionar
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 35s
  jackson:
    deserialization:
      # Una propiedad desconocida en un request es un error (400), no algo que se ignora en silencio (mass assignment)
      fail-on-unknown-properties: true
  web:
    # Los mensajes de la API son un contrato técnico en inglés, sea cual sea el idioma del servidor o del cliente
    locale: en
    locale-resolver: fixed

server:
  shutdown: graceful

logging:
  pattern:
    # El requestId (RequestIdFilter) aparece en cada línea de log de una petición
    correlation: "[%X{requestId:-}] "
