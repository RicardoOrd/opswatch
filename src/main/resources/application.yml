# Valores por defecto seguros para todos los entornos. Sin secretos: llegan por variables de entorno o Docker secrets.
# Catálogo completo de propiedades: docs/devops/environments.md#catálogo-de-propiedades
spring:
  application:
    name: opswatch
  profiles:
    group:
      # staging y production comparten la configuración de application-deployed.yml
      staging: deployed
      production: deployed
  threads:
    virtual:
      # Java 25 no fija virtual threads en synchronized (JEP 491): Tomcat, @Async y @Scheduled sin pools que dimensionar
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 35s
  # La URL y las credenciales de la base de datos dependen del entorno: application-local.yml, variables de entorno
  # o Docker secrets
  jpa:
    # Ninguna conexión retenida fuera de las transacciones
    open-in-view: false
    hibernate:
      # Solo Flyway cambia el esquema: Hibernate comprueba que las entidades coinciden con él
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    # clean borra el esquema entero: desactivado en todos los perfiles, también en local
    clean-disabled: true
    # Detecta una migración aplicada que se editó
    validate-on-migrate: true
    out-of-order: false
  jackson:
    deserialization:
      # Una propiedad desconocida en un request es un error (400), no algo que se ignora en silencio (mass assignment)
      fail-on-unknown-properties: true
  web:
    # Los mensajes de la API son un contrato técnico en inglés, sea cual sea el idioma del servidor o del cliente
    locale: en
    locale-resolver: fixed
  # Event Publication Registry (OW-034, docs/architecture/events.md#4-semántica-transaccional)
  modulith:
    events:
      # Al arrancar, se reenvían las publicaciones pendientes: lo que una caída dejó a medias se ejecuta
      republish-outstanding-events-on-restart: true
      # Una publicación completada pasa a event_publication_archive en lugar de borrarse. Solo
      # EventPublicationPurgeJob borra, y solo del archivo
      completion-mode: archive
      jdbc:
        schema-initialization:
          # Flyway es el dueño del esquema (V4__modulith_create_event_publication)
          enabled: false
  # El servidor SMTP depende del entorno (host, puerto, usuario, contraseña secreta). Los timeouts valen para todos:
  # sin ellos, Jakarta Mail espera sin límite y un SMTP lento retendría las entregas (T-33, OW-036)
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000

server:
  shutdown: graceful

management:
  server:
    # Puerto separado de la API; nunca se publica fuera del host
    port: 8081
  metrics:
    distribution:
      # Histogramas con buckets explícitos, que se agregan entre instancias en Prometheus
      # (docs/devops/observability.md#histogramas)
      slo:
        "[opswatch.monitor.check.lag]": 100ms, 250ms, 500ms, 1s, 2s, 5s, 10s, 30s, 60s
        "[opswatch.monitor.check.duration]": 50ms, 100ms, 250ms, 500ms, 1s, 2500ms, 5s, 10s, 30s
        "[opswatch.scheduler.claim.duration]": 5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s
        "[opswatch.retention.duration]": 100ms, 1s, 10s, 1m, 5m, 15m
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      # Un SMTP caído no tumba la readiness: las entregas lo reintentan con backoff (OW-036)
      enabled: false

logging:
  pattern:
    # El requestId (RequestIdFilter) aparece en cada línea de log de una petición
    correlation: "[%X{requestId:-}] "

opswatch:
  monitoring:
    engine:
      # Cada check se identifica, para que el destino sepa quién llama y pueda bloquearlo. Maven pone la versión del pom
      user-agent: "OpsWatch-Monitor/@project.version@ (+https://github.com/RicardoOrd/opswatch)"
  notification:
    webhook:
      # Cada webhook se identifica, como los checks. Maven pone la versión del pom
      user-agent: "OpsWatch-Webhook/@project.version@ (+https://github.com/RicardoOrd/opswatch)"
