# Perfil de los tests automáticos (docs/devops/environments.md#perfiles). Solo las diferencias con application.yml.
opswatch:
  security:
    password:
      # bcrypt barato: los tests no miden la resistencia del hash y el coste 12 los haría lentos.
      # DeploymentGuardrails impide que este valor llegue a staging o a producción
      bcrypt-strength: 4
    # Todas las peticiones de MockMvc llegan desde 127.0.0.1 y los tests que comparten contexto se sumarían. Los
    # límites reales se prueban en AuthRateLimitIT, con su propio contexto. password-change-per-user conserva su
    # valor: va por usuario y cada test crea el suyo
    rate-limit:
      login-per-ip: 100000/1m
      login-per-email: 100000/1m
      register-per-ip: 100000/1m
      refresh-per-ip: 100000/1m
  monitoring:
    engine:
      # Sin motor en el contexto compartido: haría peticiones reales por cada monitor que crean los tests (el DNS falso
      # resuelve api.example.com a una IP pública). Los tests del motor lo activan en su propio contexto (OW-026)
      enabled: false
  notification:
    delivery:
      # Sin worker en el contexto compartido: enviaría las entregas que crean los incidentes de los demás tests. Los tests
      # de entrega construyen el suyo contra GreenMail (OW-036)
      enabled: false
    email:
      from: "OpsWatch <alerts@opswatch.test>"
