# Actualizaciones de dependencias (docs/security/security-architecture.md#11-cadena-de-suministro-y-secretos-en-git).
# El ecosistema docker se añade en OW-009, cuando exista el Dockerfile.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Spring Boot y lo que gestiona su BOM se actualizan juntos
      spring:
        patterns:
          - "org.springframework*"

  # Imagen de PostgreSQL fijada por digest en docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
