# Actualizaciones de dependencias (docs/security/security-architecture.md#11-cadena-de-suministro-y-secretos-en-git).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Spring Boot y lo que gestiona su BOM se actualizan juntos
      spring:
        patterns:
          - "org.springframework*"

  # Imágenes base del Dockerfile, fijadas por digest
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # El JDK de la etapa de build y el JRE de la de ejecución, siempre de la misma versión
      temurin:
        patterns:
          - "eclipse-temurin"

  # Imagen de PostgreSQL fijada por digest en docker-compose.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
