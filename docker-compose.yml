# Entorno local (docs/devops/docker.md). Las variables salen de .env: scripts/dev-keys.sh lo crea.
#   docker compose up -d --wait postgres         solo la base de datos; la aplicación desde el IDE
#   docker compose --profile app up -d --build   todo en contenedores
name: opswatch

services:
  postgres:
    # Fijada por digest y actualizada por Dependabot. PostgresTestcontainer la lee de aquí: los tests usan la misma
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opswatch}
      POSTGRES_USER: ${POSTGRES_USER:-opswatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env (scripts/dev-keys.sh lo genera)}
    ports:
      # Solo loopback: accesible desde el IDE, no desde la red
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Desde la imagen 18, PGDATA es /var/lib/postgresql/18/docker: el volumen va en el directorio padre
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Por TCP: durante la inicialización, el servidor temporal solo escucha en el socket Unix
      # y un pg_isready sin -h daría healthy antes de tiempo
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    # Solo con --profile app: en el día a día la aplicación corre desde el IDE
    profiles: ["app"]
    build: .
    image: opswatch:local
    # POSTGRES_* llegan como variables de entorno; el perfil local las usa igual que cuando lee .env
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-opswatch}
    ports:
      - "127.0.0.1:8080:8080"
      # Management, solo en local y solo en loopback: en los despliegues no se publica
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    # El apagado ordenado espera hasta 35 s (spring.lifecycle.timeout-per-shutdown-phase); los 10 s por defecto de
    # Docker lo cortarían con un SIGKILL
    stop_grace_period: 40s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: 2

volumes:
  postgres-data:
